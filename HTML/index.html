<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Exercício Prático de CSS</title>
        <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <main class="grid-container">
            <article class="card">
                <span class="badge">Novo</span>
                
                <div class="card-header">
                    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Tênis Esportivo" class="card-img">
                </div>

                <div class="card-body">
                    <h2 class="product-title">Tênis Performance X</h2>
                    <p class="product-desc">
                        Desenvolvimento para máxima performance e conforto diário. Tecnologia de amortecimento responsivo de última geração.
                    </p>

                    <div class="tags-container clearfix">
                        <span class="tag-float">Corrida</span>
                        <span class="tag-float">Asfalto</span>
                    </div>

                    <div class="price-action">
                        <span class="price">R$599,90</span>
                        <button class="btn-buy">Comprar</button>
                    </div>
                </div>
            </article>
        </main>
    </body>
</html>
